name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de gradlew
        run: chmod +x gradlew

      # Valida el archivo de niveles y la lógica del juego. Si niveles.json tiene
      # un error (id repetido, respuesta inválida, etc.) el workflow falla aquí.
      - name: Tests (motor del juego y niveles)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK (debug y release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Renombrar APKs
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/Fotopalabra-debug.apk
          cp app/build/outputs/apk/release/app-release.apk salida/Fotopalabra-release.apk

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fotopalabra-apk
          path: salida/*.apk
          if-no-files-found: error

      - name: Publicar reporte de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
